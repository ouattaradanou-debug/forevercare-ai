name: cave_manager
description: "Application de gestion de cave à vin / boissons diverses (offline-first, Supabase + Drift)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # État applicatif
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Backend cloud
  supabase_flutter: ^2.5.6

  # Cache local offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Détection de connectivité (déclenche la synchronisation au retour réseau)
  connectivity_plus: ^6.0.3

  # Formatage FCFA (séparateur de milliers)
  intl: ^0.19.0

  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.2
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  # Client Dart pur (sans dépendance Flutter), utilisé uniquement par le
  # test d'intégration RLS pour pouvoir tourner via `dart test`.
  supabase: ^2.3.4
  # Utilisé explicitement par test/widget_test.dart pour fournir un
  # stockage en mémoire à supabase_flutter pendant les tests.
  shared_preferences: ^2.2.3

flutter:
  uses-material-design: true
