name: atelier_plus
description: "Atelier+ — application de gestion de clientèle pour tailleurs et couturiers, fonctionnant hors-ligne au quotidien."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestion d'état
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Backend distant (auth, base de données, stockage)
  supabase_flutter: ^2.8.0

  # Base locale hors-ligne (cache Drift/SQLite) + moteur SQLite embarqué
  drift: ^2.23.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.7.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Détection de connectivité pour la synchronisation automatique
  connectivity_plus: ^6.1.0

  # Photos : capture caméra ET choix galerie, avec compression avant upload
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Notifications locales (rappels de rendez-vous, essai gratuit)
  flutter_local_notifications: ^22.0.1
  timezone: any

  # Appeler ou contacter un client par WhatsApp directement depuis sa fiche
  url_launcher: ^6.3.1

  # Dates, formats et localisation française
  intl: ^0.20.3

  # Typographie et icônes vectorielles (identité visuelle)
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0

  # Affichage des logos d'atelier stockés à distance
  cached_network_image: ^3.4.1

  # Préférences locales simples (bandeau essai gratuit, etc.)
  shared_preferences: ^2.5.5

  # Journalisation technique
  logger: ^2.7.0

  # Identifiants uniques générés côté appareil (écriture hors-ligne d'abord)
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.23.0

  # Génère l'icône de l'application (icône de l'appareil) à partir des
  # images dans assets/icon — voir la config flutter_launcher_icons
  # ci-dessous. À relancer avec `dart run flutter_launcher_icons` après
  # toute modification de ces images.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Icône de l'application : une machine à coudre noire et dorée sur un
# fond dégradé chaleureux, pour que les tailleurs (parfois non-lettrés)
# la reconnaissent visuellement parmi leurs autres applications sans avoir
# à lire son nom.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
