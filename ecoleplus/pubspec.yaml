name: ecoleplus
description: "EcolePlus - gestion scolaire primaire (maternelle optionnelle), Burkina Faso. Nom provisoire."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.13.0

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.7.1
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

# Base du téléphone chiffrée (A10) : SQLite3MultipleCiphers à la place de
# SQLite (même API ; pas d'OpenSSL, contrairement à SQLCipher).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
