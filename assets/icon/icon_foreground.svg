    <rect x="170" y="600" width="684" height="72" rx="20" fill="#201E24"/>
    <rect x="170" y="654" width="684" height="10" fill="#D1A438"/>
    <!-- colonne avant (porte-aiguille) -->
    <rect x="330" y="440" width="90" height="170" rx="16" fill="#201E24"/>
