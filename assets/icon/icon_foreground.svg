    <ellipse cx="375" cy="500" rx="24" ry="16" fill="#D1A438"/>
    <!-- pied-de-biche -->
    <rect x="355" y="592" width="40" height="24" rx="6" fill="#3A3742"/>
    <!-- bras -->
    <rect x="330" y="350" width="415" height="90" rx="32" fill="#201E24"/>
    <!-- reflet brillant sur le bras -->
    <rect x="380" y="362" width="300" height="14" rx="7" fill="#3A3742" opacity="0.6"/>
    <!-- colonne arrière -->
    <rect x="650" y="350" width="95" height="260" rx="20" fill="#201E24"/>
    <!-- volant -->
    <circle cx="760" cy="420" r="58" fill="#201E24"/>
    <circle cx="760" cy="420" r="46" fill="#D1A438"/>
    <circle cx="760" cy="420" r="34" fill="#201E24"/>
    <circle cx="760" cy="420" r="14" fill="#EAE0CC"/>
    <!-- pied du fil -->
    <rect x="690" y="292" width="12" height="60" rx="6" fill="#3A3742"/>
    <!-- bobine de fil rouge -->
    <ellipse cx="696" cy="290" rx="36" ry="19" fill="#C1272D"/>
    <ellipse cx="696" cy="290" rx="36" ry="19" fill="none" stroke="#8f1c21" stroke-width="4"/>
    <!-- fil -->
    <path d="M670,298 C 618,380 468,420 372,592" fill="none" stroke="#C1272D" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
