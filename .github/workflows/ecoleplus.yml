name: EcolePlus

on:
  push:
    paths: ['ecoleplus/**', '.github/workflows/ecoleplus.yml']
  pull_request:
    paths: ['ecoleplus/**', '.github/workflows/ecoleplus.yml']

defaults:
  run:
    working-directory: ecoleplus

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test test/core test/features
      - run: node --experimental-strip-types tools/identifiant_parity.mjs

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase db start
      - run: supabase db reset
      - run: supabase test db

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,postgres-meta
      - run: (supabase functions serve > /tmp/functions.log 2>&1 &) && sleep 15
      - run: flutter pub get
      - run: |
          export SUPABASE_URL=http://127.0.0.1:54321
          export SUPABASE_ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"/\1/p')
          flutter test test/integration
